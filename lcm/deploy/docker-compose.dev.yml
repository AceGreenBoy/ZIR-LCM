# Локальная БД для разработки: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lcm
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lcm
    ports: ["127.0.0.1:55432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
volumes:
  pgdata:
