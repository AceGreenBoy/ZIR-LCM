{{define "content"}}
<h1>Журнал аудиту</h1>
<div class="scroll"><table><tr><th>Час</th><th>Хто</th><th>Дія</th><th>Об'єкт</th><th>Деталі</th><th>IP</th></tr>

{{end}}
